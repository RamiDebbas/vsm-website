# Build → inspect → deploy to GitHub Pages.
#
#  * Every push/PR runs typecheck, unit tests, build and the dist/ inspector (scripts/verify-dist.mjs).
#  * Only pushes to main deploy. PRs get the full check but never publish.
#  * Actions are pinned to commit SHAs (supply-chain safety); Dependabot keeps the pins fresh.
#  * No event-controlled text (titles, branch names, commit messages) is ever interpolated into `run:`.
#  * SITE_URL comes from the Pages config (custom-domain aware) unless overridden by the
#    repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables).
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      pages: read # configure-pages reads the Pages site config (base_url); a job-level block replaces the workflow default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test

      - name: Read Pages configuration
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build + inspect dist/
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish to Pages
      id-token: write # OIDC proof that this deploy came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
