version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      toolchain:
        patterns: ['vite', 'vitest', 'typescript', 'jsdom', '@types/*']
      three:
        patterns: ['three', '@types/three']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
